# Harmis format 1. En listpost under takter = en skriven takt.
# Flera ackord i en takt separeras med mellanslag.
format: 1
titel: Euforia
artist: Helen Sjöholm
version: Så mycket bättre · 2020
grundtonart: C
taktart: 4/4
tempo: 115
stil: ""
status: utkast
delar:
  - namn: Intro
    takter:
      - C G F
  - namn: Vers
    takter:
      - ackord: Am
        repris_start: true
      - G F
      - Am
      - ackord: G/B C
        repris_slut: true
  - namn: Refräng
    takter:
      - ackord: Em D
        repris_start: true
      - G G/B C
      - Em D
      - ackord: G D C
        repris_slut: true
        hus: "1."
        hus_slut: true
  - namn: Mellanspel
    takter:
      - ackord: G D/G C/G
        anvisning: BAS IN
  - namn: Vers 2
    takter:
      - ackord: Em
        anvisning: Komp
      - D C
      - Em
      - D/F# G
      - Em
      - D C
      - ackord: Em
        rytm:
          - slag: 4
            notvarde: 4
            text: F#
      - G D C
  - namn: Refräng 2
    takter:
      - ackord: Em D
        repris_start: true
      - G G/B C
      - Em D
      - ackord: G D C
        repris_slut: true
        fermat: 3
  - namn: Stick
    takter:
      - D A/D G/D
      - "%"
      - "%"
      - "%"
      - Bm A
  - ateranvand: Refräng
    anvisning: Första refrängen (kortare)

  - namn: Outro
    takter:
      - G D/G C/G
      - G D/G C/G
      - G D/G C/G
      - ackord: G D/G C/G
        slut: true
        fermat: 3
kallor:
  - url: https://chordify.net/chords/euforia-sa-mycket-battre-2020-helen-sjoholm-topic
    beskrivning: "Analys av Så mycket bättre-versionen: G-dur, 115 BPM och ackordöversikt."
anteckningar:
  - Detta är 2020-tolkningen av Loreens Euphoria, inte Helen Sjöholms låt med samma titel från Billy
    Joel-albumet 2010. Intro, form och repriser är förenklade egna bedömningar.
  - Taktindelning, antal omtagningar och vissa övergångar är agentens arbetsbedömning, inte en verifierad
    transkription. Kontrollera mot inspelningen och korrigera efter gehör.
