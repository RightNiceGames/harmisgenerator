# Harmis format 1. En listpost under takter = en skriven takt.
# Flera ackord i en takt separeras med mellanslag.
format: 1
titel: Allt jag ser
artist: Sonja Aldén
version: Under mitt tak · 2008
grundtonart: G
taktart: 4/4
tempo: 81
stil: ""
status: utkast
delar:
  - namn: Intro
    takter:
      - Em
      - G
  - namn: Vers
    takter:
      - ackord: Em
        repris_start: true
        anvisning: Bas in på 2a
      - G
      - Em
      - G
      - C
      - Am
      - C
      - ackord: D
        repris_slut: true
    markeringar:
      - element: text:Vers:0
        farg: bla
        fran: 0
        till: 4
  - namn: Refräng
    takter:
      - ackord: G
        repris_start: true
      - C
      - Am
      - ackord: D
        repris_slut: true
    markeringar:
      - element: text:Refräng:0
        farg: gron
        fran: 0
        till: 7
  - namn: Mellanspel
    takter:
      - C
      - ackord: C
        break: true
        markeringar:
          - element: text:BREAK:0
            farg: rod
            fran: 0
            till: 5
  - ateranvand: Vers
    anvisning: Utan Repeat
    markeringar:
      - element: text:Vers:0
        farg: bla
        fran: 0
        till: 4
  - ateranvand: Refräng
    anvisning: Med Repeat
    markeringar:
      - element: text:Refräng:0
        farg: gron
        fran: 0
        till: 7
  - namn: Stick
    takter:
      - Em
      - C
      - G
      - D
      - Em
      - C
      - Am
      - D
  - ateranvand: Refräng
    anvisning: Sista (med Repeat)
    markeringar:
      - element: text:Refräng:0
        farg: gron
        fran: 0
        till: 7

  - namn: Outro
    takter:
      - Em
      - C
      - G
      - D
      - Em
      - C
      - Am
      - D
      - ackord: C
        break: true
        fermat: 1
        markeringar:
          - element: text:BREAK:0
            farg: rod
            fran: 0
            till: 5
      - ackord: G
        slut: true
        fermat: 1
kallor:
  - url: https://chordify.net/es/chords/sonja-alden-songs/allt-jag-ser-chords
    beskrivning: "Automatisk ackordöversikt för Sonja Aldéns inspelning: G-dur, 81 BPM. Översikten ligger till
      grund för ackordföljden."
anteckningar:
  - Sektionsnamnen och reprisplaceringen är egna förslag.
  - Taktindelning, antal omtagningar och vissa övergångar är agentens arbetsbedömning, inte en verifierad
    transkription. Kontrollera mot inspelningen och korrigera efter gehör.
