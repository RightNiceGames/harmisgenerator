# Harmis format 1. En listpost under takter = en skriven takt.
# Flera ackord i en takt separeras med mellanslag.
format: 1
titel: Sluta aldrig gå
artist: Sonja Aldén
version: Melodifestivalen · 2020
grundtonart: D
taktart: 4/4
tempo: 79
stil: ""
status: utkast
delar:
  - namn: Intro
    takter:
      - G
      - A
      - D
  - namn: Vers 1
    takter:
      - ackord: G
        anvisning: Bas kan börja här
      - D
      - G
      - D
      - Bm
      - E
      - G
      - A
  - namn: Brygga
    takter:
      - G D
      - A
      - Em D
      - A
  - namn: Refräng
    takter:
      - ackord: G
        repris_start: true
        markeringar:
          - element: Reprisstart:0
            farg: gul
      - A/C# A
      - ackord: D/F# D D/F#
        slag:
          - 1
          - 3
          - 4
      - ackord: G Bm/F# Bm/D
        slag:
          - 1
          - 3
          - 4
      - Em
      - A/C# A
      - ackord: D/F# D D/F#
        slag:
          - 1
          - 3
          - 4
      - ackord: G Bm/F# Bm/D
        slag:
          - 1
          - 3
          - 4
      - Em
      - ackord: G A
        slag:
          - 1
          - 3
      - ackord: D
        break: true
        hus: "1."
        hus_slut: true
        markeringar:
          - element: text:1.:0
            farg: rod
            fran: 0
            till: 2
  - namn: Vers 2
    takter:
      - G
      - D
      - G
      - D
      - Bm
      - E
      - G
      - ackord: A
        repris_slut: true
        markeringar:
          - element: Reprisslut:0
            farg: gul
  - namn: Sista refräng
    takter:
      - ackord: Bb
        tonart: F
        hus: "2."
        repris_start: true
      - ackord: C/E C
        hus_slut: true
        markeringar:
          - element: text:2.:0
            farg: rod
            fran: 0
            till: 2
      - F/A F F/A
      - ackord: Bb Dm/A Dm/F
        slag: [ 1, 3, 4 ]
        repris_slut: true

      - Gm
      - Bb C
      - ackord: N.C
        break: true
        anvisning: Piano Outro
kallor:
  - url: https://www.cifraclub.com/sonja-alden/sluta-aldrig-ga/
    beskrivning: Ackordskiss med höjning från D till F i sista refrängen. Källans Dm-etikett stämmer inte med den
      utskrivna D-durharmoniken.
  - url: https://chordify.net/nl/chords/sonja-alden-songs/sluta-aldrig-ga-chords
    beskrivning: Kompletterande analys anger D-dur och 79 BPM.
anteckningar:
  - Modulationen i sista refrängen är utskriven i ackorden; den flyttas tillsammans med resten vid
    transponering.
  - Taktindelning, antal omtagningar och vissa övergångar är agentens arbetsbedömning, inte en verifierad
    transkription. Kontrollera mot inspelningen och korrigera efter gehör.
