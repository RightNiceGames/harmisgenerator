# Medleyutkast. Varje post är en takt, utom gitarrintro och fritt slut som är ackordrutor i fri tid.
format: 1
titel: Medley · Änglamark / Vintersaga / Du måste finnas / Tro
artist: Medley
grundtonart: Bb
taktart: 6/8
status: utkast
version: Repetitionsutkast efter angiven text och form
anteckningar:
  - "Tonarter: Änglamark Bb, Vintersaga Fm, Du måste finnas Eb, Tro D. Änglamark i 6/8 enligt användaren;
    därefter 4/4 enligt de befintliga låtfilerna. Taktartsbytet anges vid Vintersagas rubatointro; fast puls
    börjar vid versen."
  - Formen följer användarens text. Taktgränser och ackordplacering utgår från projektets uppskattade låtfiler
    och är inte en verifierad transkription. Kontrollera på repetition, särskilt Änglamarks frasering i 6/8.
  - "Änglamark: A en gång (8 takter), B (8), C två gånger utskrivet (16), A / variation (10). Inget
    ursprungligt intro, mellanspel eller C-avslut. Textkopplingen kontrollerad mot ackordskissen."
  - "Vintersaga: originalunderlaget transponerat Em till Fm. Rubatointrots fyra ackordrutor anger fri tid,
    inte fyra pulsbundna takter. Vers 1 (16), refräng (8), vers 2 (16), refräng två gånger (8+8), sista fyra
    takterna i sololoop tills cue."
  - "Du måste finnas: samma refrängharmonik i båda återkomsterna, hämtad från Sista refräng i underlaget (8
    takter). Vers 2 används till Vem skulle känna min ånger (8 takter). Textkoppling och taktgränser är
    uppskattade. Gitarrövergångens fyra takter är exakt de användaren angav."
  - "Tro: refräng (16), vers (16), refräng två gånger (16+16), stick/solo (8), hel sista refräng (16),
    förkortat andra varv (8) och break med fritt slut. Soloharmoniken och avslutets två ackordrutor är
    förslag. Första refrängens Bm följer lokalfilen, senare refränger använder Em; kontrollera mot ert
    arrangemang."
